  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {

              navy: '#0D5C75',
              bg: '#FDFBF7'

          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            'float': 'float 6s ease-in-out infinite',
            'float-slow': 'float 9s ease-in-out infinite',

          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
              '50%': { transform: 'translateY(-15px) rotate(3deg)' },

  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-brand-bg text-brand-navy font-sans overflow-x-hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        @apply font-display text-brand-navy;
      }
    }
    @layer utilities {
      .glass-card {
        @apply bg-white/80 backdrop-blur-md border-4 border-white shadow-[0_15px_45px_rgba(13,92,117,0.06)] rounded-[2.5rem];
      }
      .text-gradient {
        @apply bg-clip-text text-transparent bg-gradient-to-r from-brand-coral to-brand-navy;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Icons ---
    const IconRecycle = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 text-brand-blue"><path d="M7 15.3l-3 3-3-3"/><path d="M4 18.3V16a8 8 0 0 1 12.3-6.8"/><path d="M17 8.7l3-3 3 3"/><path d="M20 5.7V8a8 8 0 0 1-12.3 6.8"/></svg>);
    const IconShield = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 text-brand-coral"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>);
    const IconDroplets = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 text-brand-green"><path d="M7 16.3c2.2 0 4-1.8 4-4.3S7 3 7 3s-4 6.5-4 9 1.8 4.3 4 4.3z"/><path d="M17 21c2.2 0 4-1.8 4-4.3S17 8 17 8s-4 6.4-4 8.7 1.8 4.3 4 4.3z"/></svg>);
    const IconCheck = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 text-brand-blue"><polyline points="20 6 9 17 4 12"/></svg>);
    const IconStar = ({ className }) => (<svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>);

    // --- Components ---
    const HeroScene = () => (
      <section className="relative min-h-[92vh] flex items-center justify-center px-6 pt-24 pb-32 overflow-hidden bg-gradient-to-b from-[#EBF6F8] to-brand-bg">
        {/* Whimsical Floating Background Elements */}
        <div className="absolute top-24 left-12 text-brand-yellow/40 animate-float" style={{ animationDelay: '0s' }}><IconStar className="w-16 h-16" /></div>
        <div className="absolute bottom-36 right-16 text-brand-blue/30 animate-float-slow" style={{ animationDelay: '2.5s' }}><IconStar className="w-28 h-28" /></div>
        <div className="absolute top-44 right-32 text-brand-coral/30 animate-float" style={{ animationDelay: '1.2s' }}><IconStar className="w-12 h-12" /></div>
        
        {/* Whimsical Cloud Accents */}
        <div className="absolute -top-12 left-1/3 w-96 h-24 bg-white/40 rounded-full blur-2xl"></div>
        <div className="absolute bottom-20 left-10 w-[400px] h-32 bg-[#EBF6F8]/60 rounded-full blur-3xl"></div>

        <div className="max-w-5xl mx-auto text-center z-10 animate-fade-in-up">
          <div className="inline-block bg-white shadow-[0_10px_25px_rgba(13,92,117,0.06)] border-2 border-brand-yellow rounded-full px-6 py-2 mb-8 transform -rotate-2 hover:rotate-0 transition-transform duration-300">
            <span className="font-bold text-brand-navy text-lg tracking-wide uppercase flex items-center gap-2">✨ For Little Dreamers</span>
          </div>
          <h1 className="text-6xl md:text-7xl lg:text-8xl font-extrabold tracking-tight mb-8 leading-tight text-brand-navy drop-shadow-[0_2px_10px_rgba(13,92,117,0.04)]">
            Books that survive <br />
            <span className="text-gradient">every adventure</span>
          </h1>
          <p className="text-xl md:text-2xl text-slate-600 mb-12 max-w-3xl mx-auto leading-relaxed font-medium">
            Personalized, non-tearable, and 100% washable picture books designed to survive spills, chewing, and the wildest tantrums!
          </p>
          <div className="flex flex-col sm:flex-row items-center justify-center gap-6">
            <button className="px-10 py-5 bg-brand-coral hover:bg-[#d83f63] text-white rounded-full font-extrabold text-xl transition-all duration-300 transform hover:scale-105 shadow-[0_15px_30px_rgba(239,71,111,0.35)] hover:shadow-[0_20px_45px_rgba(239,71,111,0.5)]">
              Create a Dream Book
            </button>
            <button className="px-10 py-5 bg-white hover:bg-slate-50 text-brand-navy border-2 border-[#E1EEF2] rounded-full font-bold text-xl transition-all duration-300 shadow-[0_10px_30px_rgba(13,92,117,0.05)] hover:border-brand-navy">
              Watch the Spill Test 🧃
            </button>
          </div>
        </div>
      </section>
    );

    const usps = [
      { icon: IconRecycle, title: "Earth Friendly", description: "Crafted from premium upcycled materials. Good for their dreams, great for our planet." },
      { icon: IconShield, title: "Toddler-Proof", description: "Chew-proof, rip-proof, and completely indestructible against the wildest tantrums." },
      { icon: IconDroplets, title: "100% Washable", description: "Non-toxic, food-grade ink bonding that easily washes clean with just soap and water." }
    ];

    const USPMicroGrid = () => (
      <section className="py-24 px-6 relative z-10 bg-brand-bg">
        <div className="max-w-7xl mx-auto">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            {usps.map((usp, idx) => (
              <div key={idx} className="glass-card p-10 group hover:-translate-y-3 transition-all duration-500 cursor-pointer text-center relative overflow-hidden bg-white/70 backdrop-blur-md border-4 border-white shadow-[0_15px_45px_rgba(13,92,117,0.05)] rounded-[2.5rem]">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-yellow via-brand-coral to-brand-blue opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div className="w-20 h-20 mx-auto rounded-[2rem] bg-[#F2F8F9] flex items-center justify-center mb-8 group-hover:scale-110 group-hover:rotate-6 transition-all duration-500 shadow-sm border-2 border-white">
                  <usp.icon />
                </div>
                <h3 className="text-2xl font-bold mb-4 text-brand-navy">{usp.title}</h3>
                <p className="text-slate-500 leading-relaxed font-medium text-lg">{usp.description}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const featuredBooks = [
      { title: "Doctor Aarav", subtitle: "Healing the World's Dreams", color: "from-[#48cae4] to-[#0077b6]", emoji: "🩺" },
      { title: "IPS Pari", subtitle: "Leading with Courage & Kindness", color: "from-[#ffb703] to-[#fb8500]", emoji: "🚓" },
      { title: "Inspector Rohan", subtitle: "My Duty to Protect", color: "from-[#06d6a0] to-[#028090]", emoji: "🚦" },
      { title: "Detective Diya", subtitle: "Unlocking Mysteries", color: "from-[#cdb4db] to-[#bde0fe]", emoji: "🔬" },
      { title: "Officer Vihaan", subtitle: "Protecting the Skies", color: "from-[#a2d2ff] to-[#0077b6]", emoji: "🚁" }
    ];

    const FeaturedBooks = () => (
      <section className="py-24 px-6 relative z-10 overflow-hidden bg-[#F2F8F9]/80 rounded-[4rem] mx-4 md:mx-12 my-12 shadow-sm border-2 border-white">
        <div className="max-w-7xl mx-auto">
          <div className="text-center mb-16">
            <h2 className="text-4xl md:text-6xl font-extrabold mb-6 text-brand-navy">Inspiring Journeys</h2>
            <p className="text-slate-600 text-xl max-w-2xl mx-auto font-medium">
              From healing the world to protecting the skies. Transform your child's aspirations into a beautiful adventure!
            </p>
          </div>
          <div className="relative">
            <div className="flex gap-8 overflow-x-auto pb-16 pt-8 px-8 snap-x snap-mandatory scrollbar-hide" style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}>
              {featuredBooks.map((book, idx) => (
                <div key={idx} className="snap-center shrink-0 w-[280px] md:w-[320px] group cursor-pointer perspective-1000">
                  <div className="relative aspect-[3/4] w-full rounded-3xl transition-all duration-500 group-hover:-translate-y-6 group-hover:rotate-2 shadow-[0_15px_35px_rgba(13,92,117,0.08)] group-hover:shadow-[0_30px_60px_rgba(13,92,117,0.15)] bg-white p-2">
                    <div className="absolute left-2 top-2 bottom-2 w-4 bg-black/5 z-20 border-r border-black/5 rounded-l-2xl"></div>
                    <div className={`absolute inset-2 rounded-2xl overflow-hidden bg-gradient-to-br ${book.color}`}>
                      <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'radial-gradient(circle at 50% 50%, white 2px, transparent 2px)', backgroundSize: '24px 24px' }}></div>
                      <div className="absolute inset-0 flex flex-col items-center justify-between p-8 text-center z-10">
                        <div>
                          <div className="text-brand-navy text-[10px] font-bold tracking-widest uppercase mb-4 font-display bg-white/90 py-1.5 px-4 rounded-full shadow-sm">A Personalized Adventure</div>
                          <h3 className="text-3xl md:text-4xl font-extrabold text-white drop-shadow-md font-display leading-tight">{book.title}</h3>
                        </div>
                        <div className="text-8xl drop-shadow-lg transform group-hover:scale-125 transition-transform duration-500 group-hover:-rotate-6">{book.emoji}</div>
                        <div className="w-full bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-white">
                          <p className="text-brand-navy font-bold text-sm">{book.subtitle}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div className="h-4 w-[85%] mx-auto bg-black/10 blur-md rounded-[100%] mt-6 transition-all duration-500 group-hover:w-[70%] group-hover:blur-xl group-hover:opacity-60"></div>
                </div>
              ))}
            </div>
            <div className="absolute top-0 bottom-0 left-0 w-24 bg-gradient-to-r from-[#F2F8F9] to-transparent pointer-events-none"></div>
            <div className="absolute top-0 bottom-0 right-0 w-24 bg-gradient-to-l from-[#F2F8F9] to-transparent pointer-events-none"></div>
          </div>
        </div>
      </section>
    );

    const LivePreviewPanel = ({ childName, childPhoto, theme }) => {
      const [isGenerating, setIsGenerating] = useState(false);
      const [loadingStep, setLoadingStep] = useState(0);
      const [isPdfReady, setIsPdfReady] = useState(false);
      const [showPdfModal, setShowPdfModal] = useState(false);
      const [generatedPdfUrl, setGeneratedPdfUrl] = useState(null);

      const loadingSteps = [
        "Uploading face and PDF to AI Server...",
        "Running OpenCV Face Detection...",
        "Applying smart masks & blending...",
        "Compiling Final PDF..."
      ];

      const handleGeneratePdf = async () => {
        if (!childPhoto) {
          alert("Please upload a photo first to generate the personalized AI preview!");
          return;
        }
        if (!theme.fileData) {
          alert("This theme doesn't have a Base PDF attached! Please upload one from the Admin Dashboard first.");
          return;
        }

        setIsGenerating(true);
        setIsPdfReady(false);
        setLoadingStep(0);
        
        const loadingInterval = setInterval(() => {
          setLoadingStep(prev => Math.min(prev + 1, loadingSteps.length - 1));
        }, 1500);

        const resolveTemplateUrl = (url) => {
          if (!url) return "";
          if (url.startsWith('data:') || url.startsWith('http')) return url;
          const backendOrigin = window.location.protocol === 'file:' ? 'http://localhost:8001' : window.location.origin;
          return `${backendOrigin}${url}`;
        };

        const dataURItoBlob = (dataURI) => {
          const byteString = atob(dataURI.split(',')[1]);
          const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
          const ab = new ArrayBuffer(byteString.length);
          const ia = new Uint8Array(ab);
          for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
          }
          return new Blob([ab], {type: mimeString});
        };

        try {
          const photoBlob = dataURItoBlob(childPhoto);
          
          let pdfBlob;
          if (theme.fileData.startsWith('data:')) {
            pdfBlob = dataURItoBlob(theme.fileData);
          } else {
            const resolvedUrl = resolveTemplateUrl(theme.fileData);
            const res = await fetch(resolvedUrl);
            if (!res.ok) throw new Error("Failed to fetch template PDF from server.");
            pdfBlob = await res.blob();
          }
          
          const formData = new FormData();
          formData.append('photo', photoBlob, 'face.jpg');
          formData.append('pdf', pdfBlob, 'base.pdf');

           // Dynamically use absolute localhost URL if opened as local file, otherwise use relative path
           const fetchUrl = window.location.protocol === 'file:' ? 'http://localhost:8001/generate' : '/generate';
           const response = await fetch(fetchUrl, {
             method: 'POST',
             body: formData
           });

          if (!response.ok) {
            const errData = await response.json().catch(()=>({}));
            throw new Error(errData.error || "Backend Server Error");
          }

          // Receive final swapped PDF blob
          const resultBlob = await response.blob();
          const resultUrl = URL.createObjectURL(resultBlob);
          
          setGeneratedPdfUrl(resultUrl);
          
          clearInterval(loadingInterval);
          setLoadingStep(3);
          
          setTimeout(() => {
            setIsGenerating(false);
            setIsPdfReady(true);
          }, 800);

        } catch (error) {
          clearInterval(loadingInterval);
          setIsGenerating(false);
          alert(`Error connecting to AI Server: ${error.message}. Make sure Python server is running!`);
          console.error("AI Generation Error:", error);
        }
      };

      return (
      <div className="lg:sticky lg:top-32 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
        <div className="bg-white p-4 rounded-[3rem] shadow-[0_25px_60px_rgba(13,92,117,0.1)] relative overflow-hidden group border-8 border-white bg-gradient-to-br from-white to-[#F9F6F0]">
          <div className="absolute left-4 top-4 bottom-4 w-7 bg-gradient-to-r from-brand-navy/20 via-brand-navy/5 to-transparent z-20 border-r border-black/5 rounded-l-2xl"></div>
          <div className={`relative aspect-[3/4] w-full rounded-[2rem] overflow-hidden bg-gradient-to-br ${theme.color} transition-all duration-700 ease-in-out`}>
            <div className="absolute inset-0 opacity-20 mix-blend-overlay" style={{ backgroundImage: 'radial-gradient(circle at 50% 50%, white 3px, transparent 3px)', backgroundSize: '30px 30px' }}></div>
            
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 transform group-hover:scale-110 transition-transform duration-700 group-hover:rotate-3 drop-shadow-2xl flex flex-col items-center">
              {childPhoto ? (
                <div className="relative">
                  <img src={childPhoto} className="w-40 h-40 md:w-56 md:h-56 rounded-[2.5rem] object-cover border-8 border-white shadow-2xl z-10 relative" alt="Hero" />
                  <div className="absolute -bottom-6 -right-6 text-7xl z-20 drop-shadow-lg transform rotate-12">{theme.emoji}</div>
                </div>
              ) : (
                <div className="text-9xl transform group-hover:scale-125 transition-transform duration-700">
                  {theme.emoji}
                </div>
              )}
            </div>

            <div className="absolute inset-0 flex flex-col justify-between p-10 z-30 pointer-events-none">
              <div className="text-brand-navy font-display font-bold tracking-widest uppercase text-xs bg-white/95 self-start px-4 py-2 rounded-full shadow-sm border border-slate-100">NexEra Series</div>
              <div className="bg-white/95 p-6 rounded-3xl shadow-xl border-2 border-white backdrop-blur-md">
                <h3 className="text-brand-navy text-4xl font-extrabold font-display leading-tight mb-2">
                  The Story of <br/>
                  <span className="text-brand-coral">{childName || 'Your Hero'}</span>
                </h3>
                <p className="text-brand-blue font-bold uppercase tracking-wider text-sm">{theme.title}</p>
              </div>
            </div>
            
            {/* AI Loading Overlay */}
            {isGenerating && (
              <div className="absolute inset-0 bg-white/95 backdrop-blur-md z-40 flex flex-col items-center justify-center p-8 text-center rounded-[2rem]">
                <div className="w-16 h-16 border-4 border-brand-coral border-t-transparent rounded-full animate-spin mb-6"></div>
                <h4 className="text-2xl font-bold text-brand-navy mb-2 font-display">AI Magic in Progress</h4>
                <p className="text-brand-blue font-bold animate-pulse text-lg">{loadingSteps[loadingStep]}</p>
              </div>
            )}
            
            {/* PDF Ready Overlay */}
            {isPdfReady && (
              <div className="absolute inset-0 bg-[#2A9D8F]/95 backdrop-blur-md z-40 flex flex-col items-center justify-center p-8 text-center rounded-[2rem]">
                <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-6 shadow-xl border-4 border-[#E2F1EF]">
                  <IconCheck />
                </div>
                <h4 className="text-3xl font-bold text-white mb-2 shadow-sm font-display">PDF Ready!</h4>
                <p className="text-green-50 font-bold mb-6 text-lg">Face swapped & story mapped.</p>
                <button onClick={() => setShowPdfModal(true)} className="px-8 py-4 bg-white text-[#2A9D8F] font-black rounded-2xl shadow-xl hover:scale-105 transition-transform text-lg border-2 border-white">
                  View Full PDF Preview
                </button>
              </div>
            )}
          </div>
        </div>
        
        {/* PDF Viewer Modal */}
        {showPdfModal && (
          <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex flex-col items-center justify-center p-4">
            <div className="w-full max-w-5xl flex justify-between items-center mb-6">
              <div className="text-white">
                <h3 className="text-2xl font-bold font-display">The Story of {childName || 'Your Hero'}</h3>
                <p className="text-slate-400">Personalized PDF Preview</p>
              </div>
              <button onClick={() => setShowPdfModal(false)} className="w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white text-xl transition-colors">
                ✕
              </button>
            </div>
            
            {/* Real AI PDF Result */}
            <div className="w-full max-w-5xl h-[75vh] bg-white rounded-lg shadow-2xl overflow-hidden relative">
              {generatedPdfUrl ? (
                <iframe src={generatedPdfUrl} className="w-full h-full border-none bg-slate-100"></iframe>
              ) : (
                <div className="flex items-center justify-center h-full">Loading PDF...</div>
              )}
            </div>
            
            <div className="mt-8 flex gap-4">
              <button className="px-8 py-3 bg-white/10 hover:bg-white/20 text-white font-bold rounded-xl transition-colors">◀ Previous Page</button>
              <button className="px-8 py-3 bg-brand-yellow hover:bg-[#ffc13b] text-brand-navy font-bold rounded-xl transition-colors shadow-[0_10px_20px_rgba(255,209,102,0.3)]">Proceed to Print & Checkout</button>
            </div>
          </div>
        )}
        
        <div className="mt-8 flex flex-col gap-4">
          <button 
            onClick={handleGeneratePdf}
            className="w-full py-5 bg-brand-coral hover:bg-[#d83f63] text-white font-extrabold rounded-2xl text-xl transition-all shadow-[0_15px_30px_rgba(239,71,111,0.35)] hover:shadow-[0_20px_45px_rgba(239,71,111,0.5)] hover:scale-[1.02] flex items-center justify-center gap-2"
          >
            <span>✨</span> Generate Full Story Preview 
          </button>
          
          <p className="text-center text-sm font-bold text-slate-400 flex items-center justify-center gap-2">
            <span className="w-3 h-3 rounded-full bg-brand-green animate-pulse"></span>
            Cover live-updating
          </p>
        </div>
      </div>
    );
    };

    const defaultThemes = [
      { id: 'space', title: 'Space Explorer', emoji: '🚀', color: 'from-[#ffd166] to-[#ff9f1c]' },
      { id: 'sea', title: 'Marine Biologist', emoji: '🐋', color: 'from-[#48cae4] to-[#0077b6]' },
      { id: 'jungle', title: 'Jungle Explorer', emoji: '🦖', color: 'from-[#06d6a0] to-[#118ab2]' },
      { id: 'doctor', title: 'Doctor', emoji: '🩺', color: 'from-[#48cae4] to-[#0077b6]' },
      { id: 'police', title: 'Police Officer', emoji: '🚓', color: 'from-[#ffb703] to-[#fb8500]' }
    ];

    const DreamWeaverModule = () => {
      const [childName, setChildName] = useState('');
      const [childPhoto, setChildPhoto] = useState(null);
      const [themes, setThemes] = useState(defaultThemes);
      const [selectedTheme, setSelectedTheme] = useState(defaultThemes[0]);
      const [dreamText, setDreamText] = useState('');

      useEffect(() => {
        const fetchUrl = window.location.protocol === 'file:' ? 'http://localhost:8001/api/stories' : '/api/stories';
        fetch(fetchUrl)
          .then(res => res.json())
          .then(adminStories => {
            if (adminStories && adminStories.length > 0) {
              const mappedThemes = adminStories.map((story, idx) => ({
                id: story.id.toString(),
                title: story.title,
                emoji: story.emoji,
                color: defaultThemes[idx % defaultThemes.length].color,
                fileData: story.fileData
              }));
              setThemes(mappedThemes);
              setSelectedTheme(mappedThemes[0]);
            }
          })
          .catch(err => console.error("Failed to fetch stories database:", err));
      }, []);

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setChildPhoto(reader.result);
          reader.readAsDataURL(file);
        }
      };

      return (
